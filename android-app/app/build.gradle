plugins { id 'com.android.application' }

android {
    namespace 'com.tabnall.control'
    compileSdk 35
    defaultConfig {
        applicationId 'com.tabnall.control'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        release {
            def keyFile = System.getenv('TABNALL_KEYSTORE_PATH')
            def storePass = System.getenv('TABNALL_KEYSTORE_PASSWORD')
            def aliasValue = System.getenv('TABNALL_KEY_ALIAS')
            def keyPass = System.getenv('TABNALL_KEY_PASSWORD')
            if (keyFile && storePass && aliasValue && keyPass) {
                storeFile file(keyFile)
                storePassword storePass
                keyAlias aliasValue
                keyPassword keyPass
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
