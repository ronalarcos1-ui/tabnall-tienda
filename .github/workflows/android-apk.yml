name: Compilar APK TABNALL CONTROL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar plataforma y herramientas
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK de pruebas
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: TABNALL-CONTROL-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
