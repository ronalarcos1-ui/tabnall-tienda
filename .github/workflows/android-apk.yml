name: Compilar APK TABNALL CONTROL
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Compilar APK release firmada (requiere secretos privados)'
        required: false
        type: boolean
        default: false
      publish_release:
        description: 'Publicar APK firmada en GitHub Releases para actualizaciones internas'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compilar APK de pruebas
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Preparar firma privada de producción
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.TABNALL_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.TABNALL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TABNALL_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TABNALL_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "Faltan secretos de firma. No se generó APK release."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tabnall-release.jks"
          chmod 600 "$RUNNER_TEMP/tabnall-release.jks"
      - name: Compilar APK de producción
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        working-directory: android-app
        env:
          TABNALL_KEYSTORE_PATH: ${{ runner.temp }}/tabnall-release.jks
          TABNALL_KEYSTORE_PASSWORD: ${{ secrets.TABNALL_KEYSTORE_PASSWORD }}
          TABNALL_KEY_ALIAS: ${{ secrets.TABNALL_KEY_ALIAS }}
          TABNALL_KEY_PASSWORD: ${{ secrets.TABNALL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verificar APK firmada de producción
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        run: |
          set -euo pipefail
          APK=android-app/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='com.tabnall.control'"
          sha256sum "$APK" > "$RUNNER_TEMP/tabnall-control.apk.sha256"
      - name: Guardar APK de producción
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: TABNALL-CONTROL-Android-RELEASE
          path: android-app/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: TABNALL-CONTROL-Android-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publicar actualización en GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release == true && inputs.publish_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" android-app/app/build.gradle | head -1)
          test -n "$VERSION"
          TAG="tabnall-control-v$VERSION"
          cp android-app/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/tabnall-control.apk"
          test "$(stat -c %s "$RUNNER_TEMP/tabnall-control.apk")" -gt 10000
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La versión $TAG ya está publicada. Incrementa versionCode y versionName antes de publicar otra." >&2
            exit 1
          fi
          sha256sum "$RUNNER_TEMP/tabnall-control.apk" | sed 's| .*/|  |' > "$RUNNER_TEMP/tabnall-control.apk.sha256"
          gh release create "$TAG" "$RUNNER_TEMP/tabnall-control.apk#tabnall-control.apk" "$RUNNER_TEMP/tabnall-control.apk.sha256#tabnall-control.apk.sha256" --title "TABNALL CONTROL $VERSION" --notes "Novedades: comprobación periódica de actualizaciones, historial de cambios, recordatorio de respaldo y verificación de la firma y versión de la APK antes de instalar. Actualiza sin desinstalar. Verifica tus datos y realiza un respaldo JSON desde Reportes y respaldo." --latest
